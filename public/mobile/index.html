<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Lens & Light</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f5f5f0;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 2rem;
        text-align: center;
      }
      .container {
        max-width: 360px;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: 0.05em;
      }
      .accent {
        color: #c9a96e;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 1rem;
      }
      p {
        margin-top: 1rem;
        color: #a3a3a3;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      code {
        display: block;
        margin-top: 1.5rem;
        padding: 0.75rem;
        background: #141414;
        border: 1px solid #262626;
        border-radius: 4px;
        color: #c9a96e;
        font-size: 0.8rem;
        word-break: break-all;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #262626;
        border-top-color: #c9a96e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 2rem auto 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="accent">Photography Portfolio</p>
      <h1>Lens & Light</h1>
      <p>Loading your portfolio...</p>
      <div class="spinner" aria-hidden="true"></div>
      <p style="margin-top: 2rem; font-size: 0.8rem">
        If this screen stays, set <code>CAPACITOR_SERVER_URL</code> to your deployed site URL and
        rebuild the Android app.
      </p>
    </div>
  </body>
</html>
